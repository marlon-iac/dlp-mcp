[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dlp-invest-mcp"
version = "0.1.4"
description = "MCP server exposing DLPInvest portfolio tools via stdio for AI clients"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Marlon", email = "marlo@example.com" },
]
keywords = [
    "mcp",
    "dlp-invest",
    "finance",
    "portfolio",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
dlp-invest-mcp = "dlp_invest_mcp.server:main"

[project.urls]
Homepage = "https://github.com/marlo/dlp-invest-mcp"
Repository = "https://github.com/marlo/dlp-invest-mcp"
Issues = "https://github.com/marlo/dlp-invest-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dlp_invest_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=dlp_invest_mcp --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["dlp_invest_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]




